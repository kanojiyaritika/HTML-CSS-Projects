<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="">
        <fieldset>
            <legend style="text-align: center;"><h1>Register</h1></legend>
            <p style=" font-size: 20px;">Kindly fill in this form to register.</p>

            <label for="name">Username</label>
            <input type="text" id="name" placeholder="Enter Username"><br>
            <label for="email">Email</label>
            <input type="email" placeholder="Enter Email"><br>            
            <label for="password">Password</label>
            <input type="password" placeholder="Enter Password"><br>
            <label for="password">Repeat Password</label>
            <input type="password" placeholder="Repeat Password"><br>
       
            <input type="submit" value="Register" placeholder="Register"><br>
            <p style="text-align: center;">Already have an account? <a href=""> Log in </a></p>


        </fieldset>
    </form>
    
</body>
</html>
